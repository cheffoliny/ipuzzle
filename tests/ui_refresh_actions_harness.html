<!doctype html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iPuzzle action refresh harness</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/fa5/css/all.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/bootstrap-intelli.css">
    <link rel="stylesheet" href="../css/ui-refresh-content.css">
    <link rel="stylesheet" href="../css/ui-refresh-actions.css">
</head>
<body class="ui-refresh-content">
    <div class="row align-items-center mx-0 px-2 py-2 table-secondary">
        <div class="col-auto px-1">
            <div class="input-group input-group-sm">
                <div class="input-group-prepend"><span class="fas fa-home fa-fw"></span></div>
                <input class="form-control" type="text" placeholder="Име на обект...">
            </div>
        </div>
        <div class="col-auto px-1">
            <button type="button" class="btn btn-sm btn-light" title="Разгъни"><i class="fa fa-expand"></i></button>
        </div>
        <div class="col-auto px-1">
            <button type="button" class="btn btn-sm btn-success"><i class="fa fa-plus"></i> Добави</button>
        </div>
        <div class="col-auto px-1">
            <button type="button" class="btn btn-sm btn-primary"><i class="fa fa-search"></i> Търси</button>
        </div>
        <div class="col-auto px-1">
            <button type="button" class="btn btn-sm btn-danger"><i class="fa fa-times"></i> Изтрий</button>
        </div>
        <div class="col-auto px-1">
            <button type="button" class="btn btn-sm btn-info" disabled><i class="fa fa-sync"></i> Обнови</button>
        </div>
    </div>
</body>
</html>
