<!doctype html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalog UI harness</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/bootstrap-intelli.css">
    <link rel="stylesheet" href="../css/ui-refresh-content.css">
<link rel="stylesheet" href="../css/ui-fa7-icons.css?version=10">
    <link rel="stylesheet" href="../css/ui-refresh-nomenclatures.css?version=6">
    <style>
        html, body { width:100%; min-height:100%; margin:0; }
        .preview { margin-bottom:18px; border-bottom:6px solid #dbe5ee; }
        .preview-result { box-sizing:border-box; height:100px; padding:8px; background:#202529; color:#e6edf3; }
        .preview-result table { width:100%; border-collapse:collapse; }
        .preview-result td { padding:6px 8px; border-bottom:1px solid #394047; color:#e6edf3 !important; }
        .dialog-preview { box-sizing:border-box; max-width:calc(100% - 16px); margin:18px auto; border:1px solid #b6c6d5; }
        .service-preview { width:400px !important; }
        .mapping-preview { width:820px !important; }
        .activity-preview { width:400px !important; }
    </style>
</head>
<body class="ui-refresh-content">
<section class="preview">
    <form class="ui-nomenclature-list">
        <table class="page_data ui-nomenclature-heading"><tr><td class="page_name">Номенклатури</td><td class="buttons"><button><span class="ui-icon ui-icon-plus"></span> Добави</button> <button><span class="ui-icon ui-icon-file-import"></span> От файл</button></td></tr></table>
        <div class="ui-nomenclature-filter-wrap"><table class="search ui-nomenclature-filter"><tr><td>Тип номенклатура</td><td><select class="form-control"><option>Всички</option></select></td><td><button><span class="ui-icon ui-icon-search"></span> Търси</button></td></tr></table></div>
        <div class="preview-result"><table><tr><td>1001</td><td>Монтажна услуга</td><td>бр.</td><td>45.00 €</td></tr><tr><td>1002</td><td>Техническо обслужване</td><td>бр.</td><td>30.00 €</td></tr></table></div>
    </form>
</section>

<div class="dialog-preview service-preview">
    <form class="ui-nomenclature-dialog ui-money-nomenclature-dialog ui-service-dialog">
        <div class="page_caption">Редактиране на номенклатура услуга</div>
        <table class="input ui-nomenclature-form"><tr><td>Код</td><td><input style="width:80px" value="1001"></td><td>Име</td><td><input style="width:200px" value="Монтаж"></td></tr><tr><td>Цена</td><td><input style="width:100px" value="45.00"></td><td></td><td rowspan="2"><fieldset class="ui-nomenclature-fieldset"><legend>Позволени корекции</legend><label><input type="checkbox" class="ui-nomenclature-checkbox" checked> Име</label><br><label><input type="checkbox" class="ui-nomenclature-checkbox"> Цена</label></fieldset></td></tr><tr><td>Тип</td><td><select style="width:100px"><option>еднократна</option></select></td><td></td></tr><tr><td colspan="4" class="ui-inline-dialog-actions" style="text-align:right"><button><span class="ui-icon ui-icon-save"></span> Запиши</button> <button><span class="ui-icon ui-icon-close"></span> Затвори</button></td></tr></table>
    </form>
</div>

<div class="dialog-preview mapping-preview">
    <form class="ui-nomenclature-dialog ui-account-mapping-dialog">
        <div class="page_caption">Услуги фирми – Редакция</div>
        <table class="input ui-nomenclature-form"><tr><td style="text-align:right">Фирма:</td><td><select><option>ИНФРА ЕООД</option></select></td></tr></table>
        <fieldset class="ui-nomenclature-fieldset"><legend>Номенклатури услуги</legend><table class="ui-nomenclature-transfer"><tr><td><select size="6" multiple style="width:350px"><option>Монтаж</option><option>Абонамент</option><option>Профилактика</option></select></td><td><button class="ui-nomenclature-transfer-button"><span class="ui-icon ui-icon-right"></span></button><br><button class="ui-nomenclature-transfer-button"><span class="ui-icon ui-icon-left"></span></button></td><td><select size="6" multiple style="width:350px"><option>Техническо обслужване</option></select></td></tr></table></fieldset>
        <table class="ui-nomenclature-actions"><tr><td style="text-align:right"><button type="submit"><span class="ui-icon ui-icon-save"></span> Запиши</button> <button><span class="ui-icon ui-icon-close"></span> Затвори</button></td></tr></table>
    </form>
</div>

<div class="content ui-nomenclature-dialog-shell dialog-preview activity-preview">
    <form class="ui-nomenclature-dialog ui-activity-dialog">
        <div class="page_caption">Редакция на дейност</div>
        <table class="input ui-nomenclature-form"><tr><td width="200">Име:</td><td><input class="inp250" value="Монтаж"></td></tr><tr><td width="200">Описание:</td><td><textarea rows="4" cols="33">Монтаж на сигнално-охранителна техника</textarea></td></tr></table>
        <table class="input ui-nomenclature-actions"><tr><td></td><td style="text-align:right"><button type="submit" class="search"><span class="ui-icon ui-icon-save"></span> Запиши</button> <button><span class="ui-icon ui-icon-close"></span> Затвори</button></td></tr></table>
    </form>
</div>
</body>
</html>
