<!doctype html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access administration UI harness</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/fa5/css/all.css">
    <link rel="stylesheet" href="../css/ui-fa7-icons.css?version=18">
    <style>.input-group { display: flex; flex-wrap: wrap; }</style>
    <link rel="stylesheet" href="../css/bootstrap-intelli.css">
    <link rel="stylesheet" href="../css/ui-refresh-content.css">
    <link rel="stylesheet" href="../css/ui-refresh-results.css">
    <link rel="stylesheet" href="../css/ui-refresh-actions.css">
    <link rel="stylesheet" href="../css/ui-refresh-access.css?version=3">
    <link rel="stylesheet" href="../css/ui-refresh-nomenclatures.css?version=46">
    <style>
        html, body { width: 100%; min-height: 100%; margin: 0; }
        .harness-dialog { box-sizing: border-box; width: 850px; max-width: 100%; margin: 18px auto; border: 1px solid #aebfd0; background: #fff; }
        .harness-password { width: 400px; }
        #result table { width: 100%; border-collapse: collapse; }
        #result th, #result td { padding: 6px 10px; }
    </style>
</head>
<body class="ui-refresh-content">
<form class="ui-access-list">
    <div id="search" class="ui-access-list-shell">
        <table class="page_data ui-access-heading">
            <tr>
                <td class="page_name">Номенклатури — НИВА НА ДОСТЪП</td>
                <td class="buttons"><button type="button"><span class="ui-icon ui-icon-plus"></span>Добави</button></td>
            </tr>
        </table>
        <center class="ui-access-filter-wrap">
            <table class="table-secondary ui-access-filter-table">
                <tr><td>Група</td><td>
                    <select class="form-control"><option>— Всички —</option><option>Администратори</option></select>
                    <button type="button"><span class="ui-icon ui-icon-search"></span>Търси</button>
                    <button type="button" title="Нова група"><span class="ui-icon ui-icon-plus"></span></button>
                    <button type="button" title="Редактиране"><span class="ui-icon ui-icon-edit"></span></button>
                    <button type="button" title="Премахване"><span class="ui-icon ui-icon-delete"></span></button>
                </td></tr>
            </table>
        </center>
    </div>
    <div id="result">
        <table><thead><tr><th>Наименование</th><th>Група</th><th>Описание</th><th>Файлове</th></tr></thead>
        <tbody><tr><td>Администрация</td><td>Администратори</td><td>Пълен достъп</td><td>admin_access_level</td></tr></tbody></table>
    </div>
</form>

<section class="harness-dialog">
    <div class="page_caption">Редактиране на ниво</div>
    <form class="ui-access-dialog">
        <div id="builder" class="ui-access-dialog-body">
            <table class="input ui-access-form-table">
                <tr><td>Наименование</td><td><input class="form-control" value="Администрация"></td></tr>
                <tr><td>Група</td><td><select class="form-control"><option>Администратори</option></select></td></tr>
                <tr><td>Описание</td><td><textarea class="form-control">Пълен достъп</textarea></td></tr>
                <tr><td colspan="2">
                    <fieldset class="ui-access-selection"><legend>Файлове</legend>
                        <table class="ui-dual-list"><tr>
                            <td><select class="form-control ui-dual-list-select" multiple><option>api_clients.php</option><option>api_objects.php</option></select></td>
                            <td><button type="button"><span class="ui-icon ui-icon-right"></span></button><br><button type="button"><span class="ui-icon ui-icon-left"></span></button></td>
                            <td><select class="form-control ui-dual-list-select" multiple><option>admin_access_level.php</option><option>api_setup_access_level.php</option></select></td>
                        </tr></table>
                    </fieldset>
                </td></tr>
            </table>
        </div>
        <div id="search" class="ui-access-dialog-actions"><table><tr><td align="right">
            <button type="button" onclick="update()"><span class="ui-icon ui-icon-check"></span>Потвърди</button>
            <button type="button" onclick="window.close()"><span class="ui-icon ui-icon-close"></span>Затвори</button>
        </td></tr></table></div>
    </form>
</section>

<section class="harness-dialog harness-password">
    <form class="ui-access-dialog ui-access-password-dialog ui-current-user-password-dialog">
        <div class="page_caption"><span class="ui-icon ui-icon-key"></span> Промяна на парола за lubo</div>
        <div id="search-password" class="ui-access-dialog-body">
            <fieldset class="ui-access-selection">
                <legend>Данни за достъп</legend>
                <table class="input ui-access-form-table ui-current-user-password-table">
                    <tr><td><label>Стара парола</label></td><td><div class="input-group input-group-sm"><div class="input-group-prepend"><span class="ui-icon ui-icon-key"></span></div><input class="form-control" type="password"></div></td></tr>
                    <tr><td><label>Нова парола</label></td><td><div class="input-group input-group-sm"><div class="input-group-prepend"><span class="ui-icon ui-icon-lock"></span></div><input class="form-control" type="password"></div></td></tr>
                    <tr><td><label>Повтори новата парола</label></td><td><div class="input-group input-group-sm"><div class="input-group-prepend"><span class="ui-icon ui-icon-check"></span></div><input class="form-control" type="password"></div></td></tr>
                </table>
            </fieldset>
        </div>
        <div class="ui-access-dialog-actions"><button class="ui-current-password-save"><span class="ui-icon ui-icon-save"></span> Запиши</button><button type="button" class="ui-current-password-close"><span class="ui-icon ui-icon-close"></span> Затвори</button></div>
    </form>
</section>
</body>
</html>
