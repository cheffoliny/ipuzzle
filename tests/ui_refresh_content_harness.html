<!doctype html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iPuzzle UI content refresh harness</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/fa5/css/all.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/bootstrap-intelli.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/ui-refresh-content.css">
</head>
<body class="ui-refresh-content">
    <div class="row navbar-dark bg-faded mx-0">
        <div class="col-12">
            <p id="head_window" class="text-white text-uppercase px-3 py-2">
                <i class="fas fa-puzzle-piece mr-2"></i> Примерен вътрешен екран
            </p>
        </div>
    </div>

    <ul class="nav nav-tabs nav-intelli">
        <li class="nav-item"><a class="nav-link active" href="#">Основни данни</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Обекти</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Документи</a></li>
        <li class="nav-item"><a class="nav-link disabled" href="#">Без достъп</a></li>
    </ul>

    <form class="container-fluid pt-3" onsubmit="return false;">
        <div class="row table-secondary mx-0 px-3 py-3">
            <div class="col-12 col-md-3 mb-2 mb-md-0">
                <div class="input-group input-group-sm">
                    <div class="input-group-prepend"><span class="fas fa-building fa-fw"></span></div>
                    <select class="form-control" aria-label="Фирма"><option>Всички фирми</option></select>
                </div>
            </div>
            <div class="col-12 col-md-3 mb-2 mb-md-0">
                <div class="input-group input-group-sm">
                    <div class="input-group-prepend"><span class="fas fa-tag fa-fw"></span></div>
                    <input class="form-control" aria-label="Име" placeholder="Име на клиент">
                </div>
            </div>
            <div class="col-12 col-md-3 mb-2 mb-md-0">
                <div class="input-group input-group-sm">
                    <div class="input-group-prepend"><span class="fas fa-lock fa-fw"></span></div>
                    <input class="form-control" aria-label="Само за четене" value="Само за четене" readonly>
                </div>
            </div>
            <div class="col-12 col-md-3">
                <div class="input-group input-group-sm">
                    <button class="btn btn-success mr-2" type="button"><i class="fas fa-plus mr-1"></i> Добави</button>
                    <button class="btn btn-primary" type="button"><i class="fas fa-search mr-1"></i> Търси</button>
                </div>
            </div>
        </div>

        <fieldset class="mt-4">
            <legend>Допълнителна информация</legend>
            <div class="row mx-0 mt-3">
                <div class="col-12 col-md-6">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="fas fa-envelope fa-fw"></span></div>
                        <input class="form-control" type="email" aria-label="E-mail" placeholder="E-mail">
                    </div>
                </div>
            </div>
        </fieldset>
    </form>
</body>
</html>
