<!doctype html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iPuzzle result spacing harness</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/bootstrap-intelli.css">
    <link rel="stylesheet" href="../css/ui-refresh-content.css">
    <link rel="stylesheet" href="../css/ui-refresh-results.css">
    <style>
        #result { position: relative; height: 260px; overflow-y: scroll; }
        #result_data.body-content { position: relative; max-height: none; margin-bottom: 0 !important; }
    </style>
</head>
<body class="ui-refresh-content">
    <div id="result">
        <div id="result_data" class="container-fluid body-content pb-5">
            <table class="table table-sm table-striped table-dark mb-5">
                <thead><tr><th>#</th><th>Клиент</th><th>Обект</th><th>Статус</th></tr></thead>
                <tbody>
                    <tr><td>1</td><td>Примерен клиент</td><td>Обект 100</td><td>Активен</td></tr>
                    <tr><td>2</td><td>Втори клиент</td><td>Обект 200</td><td>Активен</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
