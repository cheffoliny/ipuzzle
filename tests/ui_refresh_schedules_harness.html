<!doctype html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Schedules UI harness</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/bootstrap-intelli.css">
    <link rel="stylesheet" href="../css/ui-refresh-content.css">
    <link rel="stylesheet" href="../css/ui-refresh-dialogs.css">
    <link rel="stylesheet" href="../css/ui-fa7-icons.css?version=8">
    <link rel="stylesheet" href="../css/ui-refresh-nomenclatures.css?version=11">
    <style>
        html,body{width:100%;min-height:100%;margin:0}.preview{box-sizing:border-box;max-width:calc(100% - 16px);margin:16px auto;border:1px solid #aebfce;background:#fff}.shift-preview{width:390px}.report-preview{width:1000px}.duty-preview{width:780px}.person-preview{width:1100px}.result-preview{box-sizing:border-box;width:100%;height:150px;overflow:auto;background:#202529;color:#e6edf3}.result-preview table{width:100%;border-collapse:collapse}.result-preview td,.result-preview th{padding:6px 8px;border-bottom:1px solid #394047;color:#e6edf3!important;text-align:left}.result-preview th{background:#087cf0;color:#fff!important}.person-grid td{text-align:center}.person-grid .planned{background:#476f95!important}.person-grid .absence{background:#87575e!important}
    </style>
</head>
<body class="ui-refresh-content">
<div class="preview shift-preview">
    <form class="ui-nomenclature-dialog ui-schedule-dialog ui-shift-editor-dialog">
        <table class="search ui-shift-editor-layout"><tr><td class="header_buttons">Редакция на смяна</td></tr><tr class="even"><td style="padding:7px">
            <div class="ui-shift-editor-field"><div class="input-group"><span class="input-group-addon"><span class="ui-icon ui-icon-code"></span></span><input class="inp100" value="Д"></div></div>
            <div class="ui-shift-editor-field"><div class="input-group"><span class="input-group-addon"><span class="ui-icon ui-icon-name"></span></span><input class="inp300" value="Дневна смяна"></div></div>
            <div class="ui-shift-editor-field"><div class="input-group"><span class="input-group-addon"><span class="ui-icon ui-icon-layout"></span></span><select class="select300"><option>Работна смяна</option></select></div></div>
            <div class="ui-shift-editor-field"><div class="input-group"><span class="input-group-addon"><span class="ui-icon ui-icon-info"></span></span><select class="select300"><option>Дневна</option></select></div></div>
            <div class="ui-shift-editor-field"><div class="input-group"><span class="input-group-addon"><span class="ui-icon ui-icon-play"></span></span><input class="inp100" value="08:00"><span>ч.</span><span class="input-group-addon"><span class="ui-icon ui-icon-stop"></span></span><input class="inp100" value="20:00"><span>ч.</span></div></div>
            <div class="ui-shift-editor-field"><div class="input-group"><span class="input-group-addon"><span class="ui-icon ui-icon-clock"></span></span><input class="inp100" value="12:00"><span>ч.</span><span class="input-group-addon"><span class="ui-icon ui-icon-clock"></span></span><input class="inp100" value="12:00"><span>ч.</span></div></div>
            <div class="ui-shift-editor-field"><div class="input-group"><span class="input-group-addon"><span class="ui-icon ui-icon-money"></span></span><input class="inp100" value="7.50"><span>€</span><span class="input-group-addon"><span class="ui-icon ui-icon-money"></span></span><input class="inp100" value="90.00"><span>€</span></div></div>
            <div class="ui-shift-editor-field ui-shift-description">Допълнителна информация<div class="input-group"><span class="input-group-addon"><span class="ui-icon ui-icon-info"></span></span><textarea>Стандартна дневна смяна</textarea></div></div>
        </td></tr></table>
        <table class="page_data ui-nomenclature-actions ui-schedule-actions"><tr><td style="text-align:right"><button type="button" class="btn btn-xs btn-success"><span class="ui-icon ui-icon-save"></span> Запиши</button> <button type="button" class="btn btn-xs btn-danger"><span class="ui-icon ui-icon-close"></span> Затвори</button></td></tr></table>
    </form>
</div>

<div class="preview report-preview">
    <form class="ui-nomenclature-list ui-schedule-report ui-shifts-count-report">
        <table class="page_data ui-nomenclature-heading"><tr><td class="page_name">Справка за смени</td><td style="text-align:right"><button type="button" class="ui-schedule-icon-button"><span class="ui-icon ui-icon-filter"></span></button></td></tr></table>
        <div class="ui-nomenclature-filter-wrap ui-schedule-filter-wrap"><table class="search ui-nomenclature-filter ui-schedule-filter ui-shifts-count-filter"><tr><td>Филтър</td><td><select><option>Всички служители</option></select></td><td><button type="button" class="ui-schedule-icon-button"><span class="ui-icon ui-icon-plus"></span></button> <button type="button" class="ui-schedule-icon-button"><span class="ui-icon ui-icon-edit"></span></button></td><td>Фирма</td><td><select><option>ИНФРА ЕООД</option></select></td><td>От</td><td><input value="01.07.2026"><button type="button" class="ui-inline-calendar-trigger"><span class="ui-icon ui-icon-calendar"></span></button></td><td>До</td><td><input value="31.07.2026"><button type="button" class="ui-inline-calendar-trigger"><span class="ui-icon ui-icon-calendar"></span></button></td><td><button type="button" class="search"><span class="ui-icon ui-icon-search"></span> Търси</button></td></tr></table></div>
        <div class="result-preview"><table><tr><th>Служител</th><th>Дневни</th><th>Нощни</th><th>Часове</th></tr><tr><td>Иван Иванов</td><td>12</td><td>4</td><td>192:00</td></tr><tr><td>Петър Петров</td><td>14</td><td>2</td><td>192:00</td></tr></table></div>
    </form>
</div>

<div class="preview duty-preview">
    <form class="ui-nomenclature-dialog ui-schedule-dialog ui-object-duty-dialog">
        <div class="page_caption">Дежурства на обект</div>
        <table class="search" style="width:100%"><tr><td>Дата</td><td><div class="input-group"><input value="21.07.2026"><span class="input-group-addon"><button type="button" class="ui-schedule-addon-button"><span class="ui-icon ui-icon-calendar"></span></button></span></div></td><td>Час</td><td><div class="input-group"><input value="08:00"><span class="input-group-addon"><button type="button" class="ui-schedule-addon-button"><span class="ui-icon ui-icon-clock"></span></button></span></div></td></tr></table>
        <div class="ui-schedule-result result-preview"><table><tr><th>Служител</th><th>Смяна</th><th>От</th><th>До</th><th></th></tr><tr><td>Иван Иванов</td><td>Дневна</td><td>08:00</td><td>20:00</td><td><button type="button" class="btn btn-sm btn-danger"><span class="ui-icon ui-icon-delete"></span> Изтрий</button></td></tr></table></div>
        <div class="fixed-bottom"><div id="filter_result"></div><button type="button" class="btn btn-sm btn-primary"><span class="ui-icon ui-icon-left"></span> Предишна</button> <button type="button" class="btn btn-sm btn-primary">Следваща <span class="ui-icon ui-icon-right"></span></button> <span style="float:right"><button type="button" class="btn btn-sm btn-success"><span class="ui-icon ui-icon-refresh"></span> Валидация</button> <button type="button" class="btn btn-sm btn-success"><span class="ui-icon ui-icon-plus"></span> Смяна</button> <button type="button" class="btn btn-sm btn-light"><span class="ui-icon ui-icon-calendar"></span> График</button> <button type="button" class="btn btn-sm btn-danger"><span class="ui-icon ui-icon-close"></span> Затвори</button></span></div>
    </form>
</div>

<div class="preview person-preview">
    <form class="ui-nomenclature-list ui-schedule-report ui-person-schedule-report">
        <table class="table-secondary" style="width:100%"><tr><td><span class="input-group-prepend"><span class="ui-icon ui-icon-tag"></span></span><select><option>ИНФРА ЕООД</option></select></td><td><span class="input-group-prepend"><span class="ui-icon ui-icon-tags"></span></span><select><option>Димитровград</option></select></td><td><span class="input-group-prepend"><span class="ui-icon ui-icon-home"></span></span><select><option>Обект 16400</option></select></td><td><span class="input-group-prepend"><span class="ui-icon ui-icon-calendar"></span></span><select><option>Юли 2026</option></select></td><td><button type="button" class="btn btn-sm btn-info"><span class="ui-icon ui-icon-clock"></span></button> <button type="button" class="btn btn-sm btn-success"><span class="ui-icon ui-icon-search"></span> График</button></td></tr></table>
        <div class="ui-schedule-result result-preview" style="height:190px"><table class="person-grid"><tr><th>Служител</th><th>20</th><th>21</th><th>22</th><th>23</th><th>24</th><th>25</th><th>26</th></tr><tr><td>Иван Иванов</td><td class="planned">Д</td><td class="planned">Д</td><td>—</td><td class="planned">Н</td><td class="planned">Н</td><td>—</td><td>—</td></tr><tr><td>Петър Петров</td><td class="planned">Д</td><td>—</td><td class="absence">О</td><td class="absence">О</td><td class="planned">Д</td><td class="planned">Д</td><td>—</td></tr></table></div>
    </form>
</div>
</body>
</html>
